name: Finalize experimental code upload

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-code.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate reconstructed sources
        shell: bash
        run: |
          python -m py_compile experiments/*.py
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path('CACC_Code.ipynb').read_text(encoding='utf-8'))
          assert notebook.get('nbformat') == 4
          for index, cell in enumerate(notebook.get('cells', []), start=1):
              if cell.get('cell_type') == 'code':
                  compile(''.join(cell.get('source', [])), f'<cell {index}>', 'exec')
          print('Notebook and scenario scripts validated successfully.')
          PY

      - name: Remove temporary staging data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .code_parts
          git commit -m "Remove temporary code-upload staging data"
          git push
